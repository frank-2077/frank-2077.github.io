<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
  <title>{% if page.title and page.title != "首页" and page.title != "Home" %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
</head>
<body>

  <header>
    <a class="title" href="{% if page.lang == 'en' %}/en/{% else %}/{% endif %}">
      <h1>何思如</h1>
    </a>
    <nav>
      <p>
        {% if page.lang == 'en' %}
          <a href="/en/">Home</a>
          <a href="/en/blog/">Blog</a>
          <a href="/en/about/">About</a>
          <a href="https://github.com/frank-2077">GitHub</a>
          <a class="lang-switch" href="{{ page.alt_url | default: '/' }}">中文</a>
        {% else %}
          <a href="/">首页</a>
          <a href="/blog/">文章</a>
          <a href="/about/">关于</a>
          <a href="https://github.com/frank-2077">GitHub</a>
          <a class="lang-switch" href="{{ page.alt_url | default: '/en/' }}">EN</a>
        {% endif %}
      </p>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <span>© {{ site.time | date: "%Y" }} 何思如 · <a href="mailto:{{ site.email }}">{{ site.email }}</a></span>
  </footer>

</body>
</html>
