# Jekyll site config — frank-2077.github.io
# Deploy: repo name must be frank-2077.github.io (or enable Pages on main branch)

title: SIRU HE
email: siruhe666@gmail.com
description: >-
  SIRU HE — LLM Inference / AI Infra engineer. Notes on CUDA kernels,
  inference engines, and low-level AI systems.
url: "https://frank-2077.github.io"
baseurl: ""
github_username: frank-2077

# Native GitHub Pages settings only — push and it builds
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false

permalink: /:year/:month/:title/
timezone: Asia/Hong_Kong

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
